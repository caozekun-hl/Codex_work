plugins { id 'com.android.application' }

android {
    namespace 'cn.juyan.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'cn.juyan.ai'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
    testOptions { unitTests.returnDefaultValues = false }
}

dependencies {
    testImplementation 'org.json:json:20240303'
}

tasks.register('verifyCore', JavaExec) {
    dependsOn 'compileDebugUnitTestJavaWithJavac'
    classpath = files("$buildDir/intermediates/javac/debugUnitTest/compileDebugUnitTestJavaWithJavac/classes") +
        files("$buildDir/intermediates/javac/debug/compileDebugJavaWithJavac/classes") +
        configurations.debugUnitTestRuntimeClasspath.filter { it.name.startsWith('json-') }
    mainClass = 'cn.juyan.ai.CoreChecks'
}
